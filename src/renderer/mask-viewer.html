<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>CrowdSense — Mask Viewer</title>
  <style>
    :root {
      --bg-0: #1a1b1e;
      --bg-1: #212226;
      --bg-2: #2a2b30;
      --border: #3c3d44;
      --text: #e8e8ea;
      --text-dim: #9a9ba3;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header {
      padding: 10px 14px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #title { font-weight: 700; font-size: 14px; }
    #subtitle { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
    #canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: var(--bg-0);
      background-image:
        linear-gradient(45deg, #232428 25%, transparent 25%),
        linear-gradient(-45deg, #232428 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #232428 75%),
        linear-gradient(-45deg, transparent 75%, #232428 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    #mask-canvas {
      image-rendering: pixelated;
      box-shadow: 0 0 0 1px var(--border);
    }
    #footer {
      flex-shrink: 0;
      background: var(--bg-1);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #hover-info {
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      font-size: 12px;
      min-width: 220px;
    }
    #legend { flex: 1; display: flex; align-items: center; gap: 8px; }
    #legend-gradient {
      flex: 1;
      height: 14px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }
    #legend-min, #legend-max { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    #empty-state {
      color: var(--text-dim);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title">Mask Viewer</div>
      <div id="subtitle">Waiting for data…</div>
    </div>
    <div id="canvas-wrap">
      <div id="empty-state">No mask loaded yet.</div>
      <canvas id="mask-canvas" style="display:none;"></canvas>
    </div>
    <div id="footer" style="display:none;">
      <div id="hover-info">Hover the grid for a cell's value</div>
      <div id="legend" style="display:none;">
        <span id="legend-min"></span>
        <div id="legend-gradient"></div>
        <span id="legend-max"></span>
      </div>
    </div>
  </div>
  <script src="mask-viewer.js"></script>
</body>
</html>
